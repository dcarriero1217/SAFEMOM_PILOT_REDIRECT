<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SafeMom has moved to app.safemom.org</title>
<script>
  // pilot.safemom.org retired 2026-09 (SafeMom Build 226 / S4). Every path,
  // query and hash is carried to the same place on app.safemom.org.
  (function () {
    var l = window.location;
    l.replace('https://app.safemom.org' + l.pathname + l.search + l.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://app.safemom.org/">
</head>
<body>
<p>SafeMom has moved to <a href="https://app.safemom.org/">app.safemom.org</a>.</p>
</body>
</html>
